<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>熊噗噗分享</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>

<body style="font-family: Arial, sans-serif; text-align:center; padding:40px 20px; background:#ffffff;">

  <h1 style="font-size:36px; margin-top:40px;">
    🎁 分享給朋友拿優惠
  </h1>

  <div style="
    margin-top:30px;
    padding:25px;
    border-radius:20px;
    background:#f5f5f5;
    font-size:24px;
    line-height:1.6;
  ">
    🚗 熊噗噗安心車隊<br>
    🎁 加好友立即領優惠！<br><br>
    👉 https://lin.ee/WRKRiFx
  </div>

  <button onclick="share()" style="
    font-size:28px;
    padding:22px 35px;
    border-radius:18px;
    background:#06C755;
    color:white;
    border:none;
    font-weight:bold;
    margin-top:40px;
  ">
    👉 分享 LINE 好友
  </button>

<script>
async function share() {
  try {
    await liff.init({ liffId: "2009949774-IQdl1D1q" });

    if (liff.isApiAvailable('shareTargetPicker')) {
      await liff.shareTargetPicker([
        {
          type: "text",
          text: "🚗 熊噗噗安心車隊\n🎁 加好友立即領優惠！\n👉 https://lin.ee/WRKRiFx"
        }
      ]);
    } else {
      alert("請從 LINE 裡開啟再分享");
    }
  } catch (error) {
    alert("分享失敗，請重新開啟頁面");
  }
}
</script>

</body>
</html>
