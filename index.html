<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>熊噗噗分享</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body style="text-align:center; font-family: Arial;">

<h2 style="font-size:28px; margin-top:40px;">
🎁 分享給朋友拿優惠
</h2>

<button onclick="share()" 
style="
font-size:22px;
padding:15px 25px;
border-radius:10px;
background-color:#06C755;
color:white;
border:none;
margin-top:20px;
">
👉 分享LINE好友
</button>
<script>
async function share() {
  await liff.init({ liffId: "2009949774-IQdl1D1q" });

  if (liff.isApiAvailable('shareTargetPicker')) {
    await liff.shareTargetPicker([
      {
        type: 'text',
        text: '🚗 熊噗噗安心車隊（台中）🎁 新好友專屬優惠
點我加入👇https://lin.ee/WRKRiFx'
   }
    ]);
  } else {
    alert('請用LINE開啟才能分享');
  }
}
</script>

</body>
</html>
